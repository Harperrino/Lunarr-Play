<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Lunarr Player Icon – Material 3 Edition (Standalone)</title>
  <desc id="desc">Isoliertes Lunarr Player Mond-Logo mit geglätteten Kanten und weichen Schicht-Schatten für M3-Tiefe.</desc>

  <defs>
    <!-- M3 Schatten für die allerunterste Schicht (Erdung) -->
    <filter id="m3-base-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#021a14" flood-opacity="0.25"/>
    </filter>

    <!-- M3 Dual-Schatten für weiche, tiefe Übergänge ZWISCHEN den Schichten -->
    <filter id="m3-layer-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <!-- Harter Kontakt-Schatten für physische Trennung -->
      <feDropShadow dx="-1" dy="2" stdDeviation="2" flood-color="#011610" flood-opacity="0.15"/>
      <!-- Weicher Umgebungs-Schatten für den sanften Übergang -->
      <feDropShadow dx="-4" dy="7" stdDeviation="6" flood-color="#022119" flood-opacity="0.22"/>
    </filter>

    <!-- Material 3 Tonal Color Gradients -->
    <linearGradient id="gBottom" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1B624C"/>
      <stop offset="50%" stop-color="#104A39"/>
      <stop offset="100%" stop-color="#083327"/>
    </linearGradient>

    <linearGradient id="gRear" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#5CCB89"/>
      <stop offset="55%" stop-color="#3D9E67"/>
      <stop offset="100%" stop-color="#2B8353"/>
    </linearGradient>

    <linearGradient id="gMiddle" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#8FE3A6"/>
      <stop offset="55%" stop-color="#67C883"/>
      <stop offset="100%" stop-color="#4AA867"/>
    </linearGradient>

    <linearGradient id="gLight" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#EDFDF0"/>
      <stop offset="55%" stop-color="#C5F3CE"/>
      <stop offset="100%" stop-color="#9DE2A9"/>
    </linearGradient>

    <linearGradient id="gTip" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#6FD090"/>
      <stop offset="55%" stop-color="#4DB173"/>
      <stop offset="100%" stop-color="#32905B"/>
    </linearGradient>
  </defs>

