name: Windows portable build

on:
  pull_request:
  push:
    branches:
      - main
      - 'build/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build portable ZIP
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build portable archive
        shell: pwsh
        run: ./tool/build_windows_portable.ps1

      - name: Upload portable archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Lunarr-Player-windows-x64-portable
          path: |
            release/*-portable.zip
            release/*-portable.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download portable archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Lunarr-Player-windows-x64-portable
          path: release
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          package_version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          test "$version" = "$package_version"
          test -f "RELEASE_NOTES_$version.md"
          archive="Lunarr-Player-$version-windows-x64-portable.zip"
          (cd release && sha256sum --check "$archive.sha256")
          release_flags=(--latest)
          if [[ "$version" == *-rc.* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "Lunarr Player $version" \
            --notes-file "RELEASE_NOTES_$version.md" "${release_flags[@]}" \
            "release/$archive" "release/$archive.sha256"
